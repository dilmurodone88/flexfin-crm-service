worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  # JSON log (so'rov qiymatlari yo'q: faqat yo'l, query yozilmaydi)
  log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"ms":"$request_time","rid":"$request_id","ua":"$http_user_agent"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  # ---- siqish ----
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json text/plain application/openmetrics-text;   # text/event-stream SIQILMAYDI

  # ---- cheklovlar ----
  limit_req_zone  $binary_remote_addr zone=api:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  client_max_body_size 1k;
  client_header_timeout 10s;
  client_body_timeout 10s;

  upstream flexfin_api {
    server api:8085;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade { default ""; }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS va boshqa xavfsizlik sarlavhalarini ilova (helmet) qo'yadi

    # faqat o'qish: GET/HEAD dan boshqasi nginx'dayoq to'xtaydi
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

    location / {
      limit_req  zone=api burst=40 nodelay;
      limit_conn conn 20;
      proxy_pass http://flexfin_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;      # qo'shilmaydi, yoziladi: soxtalashtirib bo'lmaydi
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }

    # real vaqt (SSE): buferlash yo'q, uzoq ulanish
    location = /v1/feed/stream {
      proxy_pass http://flexfin_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Request-Id $request_id;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no;
    }

    location = /health { proxy_pass http://flexfin_api; access_log off; }
  }
}
