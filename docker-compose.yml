# nginx (TLS, HTTP/2, gzip) -> api (NestJS). Faqat nginx tashqariga ochiq.
# Ishga tushirish:  ./scripts/gen-certs.sh   (bir marta)   &&   docker compose up -d --build
name: flexfin-crm-service

services:
  api:
    build: .
    image: flexfin-crm-service:2.0.0
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      COMPRESS: "false"            # siqishni nginx bajaradi
      LOG_FILE: "false"            # loglarni Docker yig'adi (json-file, aylantirish bilan)
      TRUSTED_PROXIES: 172.28.0.10 # nginx IP'si
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    expose: ["8085"]
    networks:
      edge:
        ipv4_address: 172.28.0.20
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "10" }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      edge:
        ipv4_address: 172.28.0.10
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "10" }

networks:
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
